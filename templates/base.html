<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMARC Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                if (response.ok) {
                    const text = await response.text();
                    const statusEl = document.getElementById('app-status');
                    if (statusEl.textContent !== text) {
                        statusEl.textContent = text;
                        // flash animation to indicate update
                        statusEl.classList.add('text-green-200');
                        setTimeout(() => statusEl.classList.remove('text-green-200'), 500);
                    }
                }
            } catch (error) {
                console.error("Failed to fetch status", error);
            }
        }
        
        setInterval(fetchStatus, 2000);
        document.addEventListener('DOMContentLoaded', fetchStatus);
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><a href="/">DMARC Explorer</a></h1>
            <div class="text-sm font-medium bg-blue-700 px-3 py-1 rounded-full transition-colors duration-500" id="app-status">Loading...</div>
        </div>
    </header>
    <main class="container mx-auto p-4 mt-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
