[package]
name = "dmarc-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
futures = "0.3"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }
axum = "0.7"
askama = { version = "0.12" }
askama_axum = "0.4"
mailparse = "0.14"
zip = "0.6"
flate2 = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
bytes = "1.5"
hyper = "1.0"
tower-http = { version = "0.5", features = ["trace"] }
